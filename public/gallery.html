<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Collaborative Constellation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <h1 class="title">Gallery</h1>
                <div class="subtitle">Constellations drawn by everyone</div>
            </div>
            <div class="header-actions">
                <a href="/" class="gallery-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5"></path>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Back to drawing</span>
                </a>
            </div>
        </div>
    </header>

    <main class="gallery-page">
        <div id="galleryGrid" class="gallery-grid"></div>
        <div id="galleryEmpty" class="gallery-empty" style="display: none;">
            <p>No constellations saved yet.</p>
            <p><a href="/">Draw the first one →</a></p>
        </div>
    </main>

    <div class="modal" id="detailModal">
        <div class="modal-content modal-content-large">
            <button class="modal-close" id="closeDetailModal">&times;</button>
            <div class="result-header">
                <span class="result-eyebrow">Gallery</span>
                <div class="constellation-name-input" id="detailName" style="pointer-events: none;"></div>
            </div>
            <div class="story-card" id="detailStoryCard">
                <svg class="story-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <p class="story-text" id="detailStory"></p>
            </div>
            <div class="sky-view">
                <img id="detailImage" src="" alt="" style="display: none;">
                <div class="sky-view-loading" id="detailLoading">Loading…</div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="detailCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <script src="gallery.js"></script>
</body>
</html>
