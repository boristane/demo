<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Constellation - NASA SpaceApps 2025</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <h1 class="title">Collaborative Constellation</h1>
                <div class="subtitle">Draw together and watch AI turn it into sky lore</div>
            </div>
            <div class="header-actions">
                <a href="/gallery.html" class="gallery-link" title="View gallery">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Gallery</span>
                </a>
                <div class="room-info">
                    <span class="room-label">Room:</span>
                    <span class="room-id" id="roomId"></span>
                    <button class="copy-btn" id="copyBtn" title="Copy room link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="prompt-banner" id="promptBanner">
        <span class="prompt-label">Today's challenge</span>
        <span class="prompt-text" id="promptText">Loading…</span>
    </div>

    <div class="controls-bar">
        <button class="btn btn-clear" id="clearBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
            </svg>
            <span class="btn-text">Clear</span>
        </button>

        <div class="reactions-bar" id="reactionsBar" aria-label="Reactions">
            <button class="reaction-btn" data-emoji="✨" type="button">✨</button>
            <button class="reaction-btn" data-emoji="🌟" type="button">🌟</button>
            <button class="reaction-btn" data-emoji="💫" type="button">💫</button>
            <button class="reaction-btn" data-emoji="⭐" type="button">⭐</button>
            <button class="reaction-btn" data-emoji="❤️" type="button">❤️</button>
            <button class="reaction-btn" data-emoji="🔥" type="button">🔥</button>
        </div>

        <button class="btn btn-analyze" id="analyzeBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-spinner" style="display: none;">
                <path d="M21 12a9 9 0 11-6.219-8.56"></path>
            </svg>
            <span class="btn-text">Create Constellation</span>
        </button>
    </div>

    <main>
        <aside class="participants-panel">
            <h2>Participants</h2>
            <ul id="participantsList" class="participants-list"></ul>
        </aside>

        <div class="canvas-wrapper">
            <canvas id="drawingCanvas"></canvas>
            <div class="cursor-layer" id="cursorLayer"></div>
            <div class="reactions-layer" id="reactionsLayer"></div>
            <div class="drawing-instruction" id="drawingInstruction">Click and drag to draw</div>
        </div>
    </main>

    <div class="notification" id="notification"></div>

    <div class="modal" id="nameModal">
        <div class="modal-content" style="max-width: 400px;">
            <h2>Welcome!</h2>
            <p>Please enter your name to join the drawing room:</p>
            <input type="text" id="nameInput" placeholder="Your name" maxlength="20" autofocus>
            <button class="btn btn-primary" id="joinBtn">Join Room</button>
        </div>
    </div>

    <div class="modal" id="resultsModal">
        <div class="modal-content modal-content-large">
            <button class="modal-close" id="closeResultsModal">&times;</button>

            <div class="result-header">
                <span class="result-eyebrow">The stars revealed…</span>
                <input class="constellation-name-input" id="constellationNameInput" maxlength="60" placeholder="Constellation name">
            </div>

            <div class="story-card" id="storyCard">
                <svg class="story-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <p class="story-text" id="storyText"></p>
            </div>

            <div class="sky-view" id="skyView">
                <img id="skyViewImage" src="" alt="Sky view of constellation" style="display: none;">
                <div class="sky-view-loading" id="skyViewLoading">Generating sky view…</div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-download" id="downloadBtn" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download
                </button>
                <button class="btn btn-save" id="saveBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Save to Gallery
                </button>
                <button class="btn btn-primary" id="closeResultsBtn">Continue Drawing</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
